<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RNXZT</title>
    <meta name="description" content="RNXZT builds intelligent, scalable software products. Founded by Ranjit Singha. Home of Captionise and more.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            padding: 3rem 1.25rem;
        }

        .container {
            text-align: center;
            animation: fadeIn 1.5s ease-out;
            width: 100%;
            max-width: 36rem;
            margin: auto;
        }

        .brand {
            font-size: clamp(2.25rem, 9vw, 3rem);
            font-weight: 700;
            letter-spacing: 0.18em;
            color: #1a1a1a;
            margin-bottom: 0.75rem;
        }

        .tagline {
            font-size: 1rem;
            font-weight: 400;
            color: #1a1a1a;
            margin-bottom: 0.375rem;
        }

        .founder {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 1.5rem;
        }

        .email-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 0.875rem;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .email-icon {
            width: 20px;
            height: 20px;
            stroke: #1a1a1a;
            stroke-width: 1.5;
            fill: none;
        }

        .projects {
            margin-top: 3rem;
            text-align: left;
        }

        .projects-title {
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 0.875rem;
        }

        .project-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            text-decoration: none;
            color: inherit;
            background: #ffffff;
            transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .project-card:hover,
        .project-card:focus-visible {
            border-color: #d1d5db;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
            transform: translateY(-2px);
            outline: none;
        }

        .project-icon {
            width: 56px;
            height: 56px;
            border-radius: 13px;
            flex-shrink: 0;
            display: block;
        }

        .project-info {
            display: block;
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .project-name {
            display: block;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.125rem;
        }

        .project-tagline {
            display: block;
            font-size: 0.8125rem;
            color: #6b7280;
            margin-bottom: 0.5rem;
        }

        .badge {
            display: inline-block;
            font-size: 0.6875rem;
            font-weight: 600;
            color: #15803d;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 999px;
            padding: 0.1875rem 0.5rem;
        }

        .project-arrow {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: #9ca3af;
            stroke-width: 1.75;
            fill: none;
            transition: stroke 0.2s ease, transform 0.2s ease;
        }

        .project-card:hover .project-arrow,
        .project-card:focus-visible .project-arrow {
            stroke: #1a1a1a;
            transform: translateX(2px);
        }

        .more-projects {
            margin-top: 0.75rem;
            font-size: 0.8125rem;
            color: #9ca3af;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .container {
                animation: none;
            }

            .project-card,
            .project-arrow {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1 class="brand">RNXZT</h1>
        <p class="tagline">Building intelligent, scalable products.</p>
        <p class="founder">Founded by Ranjit Singha</p>
        <a href="mailto:contact@ranjitsingha.in" class="email-link" aria-label="Email contact@ranjitsingha.in">
            <svg class="email-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="2" y="5" width="20" height="14" rx="2"/>
                <polyline points="2,7 12,13 22,7"/>
            </svg>
            <span>contact@ranjitsingha.in</span>
        </a>

        <section class="projects" aria-labelledby="projects-title">
            <h2 class="projects-title" id="projects-title">Startup Projects</h2>

            <a class="project-card"
               href="https://play.google.com/store/apps/details?id=com.captionise.app"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Captionise on Google Play">
                <img class="project-icon" src="assets/captionise-icon.png" alt="Captionise app icon" width="56" height="56">
                <span class="project-info">
                    <span class="project-name">Captionise</span>
                    <span class="project-tagline">Create captions instantly for videos in any language</span>
                    <span class="badge">Live on Google Play</span>
                </span>
                <svg class="project-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12,5 19,12 12,19"/>
                </svg>
            </a>

            <p class="more-projects">More projects in the works.</p>
        </section>
    </main>
</body>
</html>
